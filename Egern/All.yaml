name: Sam9527 小组件合集
description: 整合油价、天气、汇率（主/备）脚本。支持通过变量环境直接在界面修改参数。

env_schema:
  OIL_REGION:
    name: ⛽️ 油价查询地区
    description: 请输入省份名称（例如：山东、北京、广东）
    default_value: 山东
  WEATHER_CITY:
    name: ⛅️ 天气查询城市
    description: 请输入城市名称（例如：北京、上海、成都）
    default_value: 北京
  EXCHANGE_PAIR:
    name: 💱 汇率货币对
    description: 格式为“基础货币,目标货币”（例如：USD,CNY）
    default_value: USD,CNY

scriptings:
  - generic:
      name: 今日油价
      script_url: https://raw.githubusercontent.com/Sam9527-M/widget/refs/heads/main/Egern/Youjia2.js
      timeout: 10
  - generic:
      name: 每日天气
      script_url: https://raw.githubusercontent.com/Sam9527-M/widget/refs/heads/main/Egern/Tianqi.js
      timeout: 10
  - generic:
      name: 实时汇率
      script_url: https://raw.githubusercontent.com/Sam9527-M/widget/refs/heads/main/Egern/Huilv.js
      timeout: 10
  - generic:
      name: 实时汇率备用
      script_url: https://raw.githubusercontent.com/Sam9527-M/widget/refs/heads/main/Egern/HL2.js
      timeout: 10

widgets:
  - name: 今日油价
    script_name: 今日油价
  - name: 每日天气
    script_name: 每日天气
  - name: 实时汇率
    script_name: 实时汇率
  - name: 实时汇率备用
    script_name: 实时汇率备用
